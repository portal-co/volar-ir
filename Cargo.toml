[workspace]
members = [
    "crates/ir/volar-ir",
    "crates/ir/volar-ir-common",
    "crates/ir/volar-ir-config",
    "crates/ir/volar-ir-passes",
    "crates/ir/volar-ir-opt",
    "crates/ir/volar-ir-virt",
    "crates/ir/volar-ir-text",
    "crates/ir/vaffle",
    "crates/ir/volar-vaffle-target",
    "crates/ir/volar-provenance",
    "crates/ir/volar-side",
    "crates/ir/volar-lir",
    "crates/ir/volar-lir-text",
    "crates/ir/volar-lir-saved",
    "crates/ir/volar-lir-test-corpus",
    "crates/ir/volar-riscv-test-programs",
    "crates/ir/volar-ssa-lir-replay",
    "crates/fuzz/volar-fuzz",
    "crates/backends/volar-c-backend",
    "crates/backends/volar-llvm-backend",
    "crates/backends/volar-wasm-backend",
    "crates/backends/volar-circuit-source",
    "crates/backends/volar-noir-backend",
    "crates/backends/volar-pod2-backend",
    "crates/frontends/volar-llvm-vaffle-import",
    "crates/frontends/volar-llvm-ir-import",
    "crates/frontends/volar-wasm-circuit-import",
    "crates/frontends/volar-ir-build",
    "crates/pass/volar-llvm-plugin-api",
    "crates/pass/volar-llvm-plugin",
    "crates/tools/volar-ir-schema-gen",
]
resolver = "3"

[workspace.package]
license = "CC0-1.0 AND MIT AND Apache-2.0"
description = "Volar IR and VAFFLE: a reusable compiler IR, lowering pipeline (VAFFLE-to-IR, movfuscation, virtualization, circuit lowering), and optimization passes (DCE, CSE, constant folding) for WASM-derived circuits"
repository = "https://github.com/portal-co/volar-ir.git"

[workspace.dependencies]
volar-ir-config        = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir               = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir-passes        = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir-opt           = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir-virt          = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir-text          = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
vaffle                 = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-vaffle-target    = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ir-common        = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-provenance       = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-side             = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-lir              = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-lir-text         = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-lir-saved        = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-lir-test-corpus  = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-ssa-lir-replay   = { path = "crates/ir/volar-ssa-lir-replay", version = "0.1.0" }
volar-fuzz             = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-c-backend         = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-llvm-backend      = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-wasm-backend      = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-circuit-source    = { path = "crates/backends/volar-circuit-source", version = "0.1.0" }
volar-noir-backend      = { path = "crates/backends/volar-noir-backend", version = "0.1.0" }
volar-pod2-backend      = { path = "crates/backends/volar-pod2-backend", version = "0.1.0" }
volar-ir-build          = { git = "https://github.com/portal-co/volar-ir.git", version = "0.1.0" }
volar-llvm-vaffle-import = { path = "crates/frontends/volar-llvm-vaffle-import", version = "0.1.0" }
volar-llvm-ir-import    = { path = "crates/frontends/volar-llvm-ir-import", version = "0.1.0" }

portal-pc-waffle-ir       = { version = "0.6.0-alpha.1", git = "https://github.com/portal-co/waffle-.git" }
portal-pc-waffle-frontend = { version = "0.6.0-alpha.1", git = "https://github.com/portal-co/waffle-.git" }
wax-meta                  = { version = "0.1.0", git = "https://github.com/portal-co/portal-container.git" }

rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }

inkwell = { version = "0.10.0", features = [
    "llvm22-1",
] } # matches cirrus's pin (crates/recompile/cirrus-llvm*), and the Homebrew
    # `llvm`/`llvm@22` formula actually installed on dev machines — llvm-sys
    # auto-detects it via `brew --prefix llvm@22`/`brew --prefix llvm`, no
    # custom build.rs needed.

ar     = "0.9"
object = "0.36"
cc     = "1.2"
