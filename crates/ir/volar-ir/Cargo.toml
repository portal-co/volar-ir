[package]
name = "volar-ir"
version = "0.1.0"
edition = "2024"
license.workspace = true
description.workspace = true
repository.workspace = true

[dependencies]
log = { version = "0.4", optional = true }
volar-provenance.workspace = true
volar-ir-common.workspace = true
volar-side.workspace = true
volar-lir.workspace = true
rkyv = { workspace = true, optional = true }
lazy-repo = { path = "../../../../lazy-repo/crates/lazy-repo", default-features = false, optional = true }

[features]
log-trace = ["dep:log"]
rkyv = ["lazy", "dep:rkyv", "lazy-repo/rkyv", "volar-ir-common/rkyv", "volar-side/rkyv"]
lazy = ["dep:lazy-repo"]
