[package]
name = "volar-lir-text"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Text-format serialisation and parsing for volar-lir types and SavedLirModule"
repository.workspace = true

[dependencies]
volar-lir        = { git = "https://github.com/portal-co/volar-ir.git" }
volar-lir-saved  = { git = "https://github.com/portal-co/volar-ir.git" }
volar-ir-common  = { git = "https://github.com/portal-co/volar-ir.git" }

[features]
default = []
# Enables the parser (ParseText impls).  Still no_std; uses alloc.
parse = []

[dev-dependencies]
volar-log = { git = "https://github.com/portal-co/volar.git" }
volar-lir-saved = { git = "https://github.com/portal-co/volar-ir.git" }
