[package]
name = "volar-ir-build"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Build-time IR transformation pipeline: VAFFLE/WASM/LLVM sources, inline-everything, unroll-everything vs movfuscation, lower to Volar IR / LIR"
repository.workspace = true

[features]
default = []
vaffle = ["dep:vaffle", "dep:volar-vaffle-target", "dep:volar-ssa-lir-replay"]
wasm = ["vaffle", "dep:portal-pc-waffle-ir", "dep:portal-pc-waffle-frontend"]
llvm = ["vaffle", "dep:inkwell", "dep:volar-llvm-vaffle-import", "dep:volar-llvm-ir-import", "dep:ar", "dep:object"]
cc = ["llvm", "dep:cc"]

[dependencies]
volar-ir = { workspace = true, features = ["rkyv"] }
volar-ir-common.workspace = true
volar-ir-opt.workspace = true
volar-ir-passes.workspace = true
volar-circuit-source.workspace = true
volar-lir.workspace = true
volar-lir-saved = { workspace = true, features = ["rkyv"] }
rkyv = { workspace = true, features = ["bytecheck"] }
vaffle = { workspace = true, features = ["rkyv"], optional = true }
volar-vaffle-target = { workspace = true, optional = true }
volar-ssa-lir-replay = { workspace = true, optional = true }
portal-pc-waffle-ir = { workspace = true, optional = true }
portal-pc-waffle-frontend = { workspace = true, optional = true }
inkwell = { workspace = true, optional = true }
volar-llvm-vaffle-import = { workspace = true, optional = true }
volar-llvm-ir-import = { workspace = true, optional = true }
ar = { workspace = true, optional = true }
object = { workspace = true, optional = true }
cc = { workspace = true, optional = true }

[dev-dependencies]
wat = "1.212.0"
volar-fuzz.workspace = true
volar-c-backend.workspace = true
volar-lir-test-corpus.workspace = true

[[test]]
name = "wasm_inlined"
required-features = ["wasm"]

[[test]]
name = "llvm_frontends"
required-features = ["llvm"]

[[test]]
name = "llvm_lto"
required-features = ["llvm"]
